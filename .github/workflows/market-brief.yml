name: Daily market brief

# 07:30 Singapore time = 23:30 UTC the previous day.
# Cron in GitHub Actions is UTC and can drift by several minutes under load.
on:
  schedule:
    - cron: '30 23 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Render brief.html as an artifact instead of emailing'
        required: false
        default: 'false'

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: brief/requirements.txt

      - name: Install dependencies
        run: pip install -r brief/requirements.txt

      - name: Generate and send brief
        env:
          GMAIL_USER:          ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:  ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO:            ${{ secrets.EMAIL_TO }}
          FINNHUB_API_KEY:     ${{ secrets.FINNHUB_API_KEY }}
          MARKETAUX_API_KEY:   ${{ secrets.MARKETAUX_API_KEY }}
          BRIEF_DRY_RUN:       ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
        run: python brief/generate.py

      - name: Upload brief.html (dry-run only)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: brief-html
          path: brief/brief.html
          if-no-files-found: ignore
